<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-dakr bg-light">
    <div class="container text-white bg-secondary col-md-6 rounded mt-3 py-3">
        <h1>Heat Index Checker</h1>
        <form>
            <label for="temp">Temperature in °C</label>
            <input type="number" id="temp" min="0" max="100">
            <label for="hum">Humidity in %</label>
            <input type="number" id="hum" min="0" max="100">
            <hr>
            <button class="btn btn-primary" type="button" onclick="checkTemp()">Check</button>
            <button class="btn btn-danger" type="button" onclick="window.location.reload()">Refresh</button>
        </form>
        <p id="replace1"></p>
        <p id="replace2"></p>
    </div>
    <script src="main.js"></script>
</body>
</html>
